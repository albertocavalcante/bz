name: Release

on:
  push:
    tags:
      - "v0.1.0-rc.[1-9]*"

# Never cancel an in-flight release; a re-pushed tag queues behind it.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  # Gate: nothing is built or published from a commit that fails tests or
  # has a called vulnerability.
  verify:
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    name: Test and Vulnerability Check
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v0\.1\.0-rc\.[123456789][0123456789]*$ ]]; then
            printf 'Expected a v0.1.0 release candidate tag such as v0.1.0-rc.1, got %s\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools.go.sum

      - name: Test
        run: go tool -modfile=tools.go.mod gotestsum --format pkgname-and-test-fails -- -race ./...

      - name: Run govulncheck
        run: go tool -modfile=tools.go.mod govulncheck ./...

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            name: linux-amd64
          - os: ubuntu-24.04
            goos: linux
            goarch: arm64
            name: linux-arm64
          - os: macos-15
            goos: darwin
            goarch: arm64
            name: darwin-arm64
          - os: macos-15
            goos: darwin
            goarch: amd64
            name: darwin-amd64
          - os: windows-2022
            goos: windows
            goarch: amd64
            name: windows-amd64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Get version
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build (Unix)
        if: runner.os != 'Windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          COMMIT="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X github.com/albertocavalcante/bz/cmd.version=${{ steps.version.outputs.version }} \
            -X github.com/albertocavalcante/bz/cmd.commit=${COMMIT} \
            -X github.com/albertocavalcante/bz/cmd.date=${DATE}"
          go build -ldflags "$LDFLAGS" -o bz .
          mkdir -p dist
          tar -czvf dist/bz-${{ matrix.name }}.tar.gz bz
          cd dist
          shasum -a 256 bz-${{ matrix.name }}.tar.gz > bz-${{ matrix.name }}.tar.gz.sha256

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        shell: pwsh
        run: |
          $commit = "${{ github.sha }}".Substring(0, 7)
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $ldflags = "-s -w -X github.com/albertocavalcante/bz/cmd.version=${{ steps.version.outputs.version }} -X github.com/albertocavalcante/bz/cmd.commit=$commit -X github.com/albertocavalcante/bz/cmd.date=$date"
          go build -ldflags "$ldflags" -o bz.exe .
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path bz.exe -DestinationPath dist/bz-${{ matrix.name }}.zip
          $hash = (Get-FileHash -Algorithm SHA256 dist/bz-${{ matrix.name }}.zip).Hash.ToLower()
          "$hash  bz-${{ matrix.name }}.zip" | Out-File -Encoding ASCII dist/bz-${{ matrix.name }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2

        with:
          name: binary-${{ matrix.name }}
          path: dist/bz-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-24.04
    name: Create Release
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release/ \;
          ls -la release/

      # Combined checksums of the archives. The Windows runner writes CRLF
      # line endings, so normalise before verifying.
      - name: Generate checksums
        working-directory: release
        shell: bash
        env:
          LC_ALL: C
        run: |
          archives=(bz-darwin-amd64.tar.gz bz-darwin-arm64.tar.gz bz-linux-amd64.tar.gz bz-linux-arm64.tar.gz bz-windows-amd64.zip)
          for archive in "${archives[@]}"; do
            test -s "$archive"
            test -s "$archive.sha256"
            expected=$(sha256sum "$archive")
            tr -d '\r' < "$archive.sha256" | diff -u <(printf '%s\n' "$expected") -
          done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq "$((2 * ${#archives[@]}))"
          cat ./*.sha256 | tr -d '\r' | sort -k2 > checksums.txt
          cat checksums.txt
          sha256sum --check --strict checksums.txt | diff -u <(printf '%s: OK\n' "${archives[@]}") -

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/*.tar.gz
            release/*.zip

      - name: Verify draft assets and publish prerelease
        working-directory: release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LC_ALL: C
        run: |
          list_releases_for_tag() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/releases" |
              jq --slurp --arg tag "$GITHUB_REF_NAME" '[.[][] | select(.tag_name == $tag)]'
          }

          verify_tag_commit() {
            local actual
            actual=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$GITHUB_REF_NAME" --jq '.sha')
            if [[ "$actual" != "$expected_commit" ]]; then
              printf 'Tag %s does not point to built commit %s\n' "$GITHUB_REF_NAME" "$expected_commit" >&2
              return 1
            fi
          }

          existing=$(list_releases_for_tag)
          if ! jq -e 'length == 0' <<< "$existing" > /dev/null; then
            printf 'A release or draft already exists for %s. See the release recovery instructions.\n' "$GITHUB_REF_NAME" >&2
            exit 1
          fi
          expected_commit=$(git rev-parse HEAD)
          verify_tag_commit

          files=(*.tar.gz *.zip *.sha256 checksums.txt)
          test "${#files[@]}" -eq 11
          draft_url=$(gh release create "$GITHUB_REF_NAME" "${files[@]}" --repo "$GITHUB_REPOSITORY" \
            --draft --prerelease --verify-tag --latest=false --generate-notes)
          printf 'Uploaded draft %s\n' "$draft_url"
          draft_id=$(list_releases_for_tag | jq -er --arg url "$draft_url" '
            if length == 1 and .[0].draft and .[0].prerelease and .[0].html_url == $url
            then .[0].id
            else error("Expected exactly one newly created prerelease draft")
            end')

          expected=$(
            for file in "${files[@]}"; do
              checksum=$(sha256sum "$file")
              printf '%s\tuploaded\tsha256:%s\n' "$file" "${checksum%% *}"
            done | sort
          )
          uploaded=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases/$draft_id/assets" \
            --jq '.[] | [.name, .state, .digest] | @tsv' | sort)
          diff -u <(printf '%s\n' "$expected") <(printf '%s\n' "$uploaded")
          verify_tag_commit

          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$draft_id" \
            -F draft=false -F prerelease=true -f make_latest=false --jq '.html_url'
