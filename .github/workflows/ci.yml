name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-amd64
          - os: macos-15
            name: darwin-arm64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582302633cf483dc284489ae94db1c9cc1ce # v6.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools.go.sum

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -race -v -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.name == 'linux-amd64'
        uses: codecov/codecov-action@18283e04ce6e62d37312384ff67231eb8fd56d24 # v5.4.3
        with:
          files: coverage.out
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-24.04
    name: Lint (Go)
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582302633cf483dc284489ae94db1c9cc1ce # v6.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Sync tool dependencies
        run: go mod tidy -modfile=tools.go.mod

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@1e7e51e28fd01011a2e17f9e60b3e0412063ca8a # v9.2.0
        with:
          version: v2.1.6
          args: --config=tools/lint/golangci.toml

  govulncheck:
    runs-on: ubuntu-24.04
    name: Vulnerability Check
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582302633cf483dc284489ae94db1c9cc1ce # v6.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  actionlint:
    runs-on: ubuntu-24.04
    name: Lint (Actions)
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@f4bb4d50c4c9e45cc64f413d2bc438ea1cf2d9d5 # v1.70.0
        with:
          fail_level: error
          filter_mode: nofilter
          reporter: github-pr-review
