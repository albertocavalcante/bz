name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-amd64
          - os: macos-15
            name: darwin-arm64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools.go.sum

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go tool -modfile=tools.go.mod gotestsum --format pkgname-and-test-fails -- -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.name == 'linux-amd64'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-24.04
    name: Lint (Go)
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools.go.sum

      # Same pinned linter as `just lint` (version lives in tools.go.mod).
      - name: Run golangci-lint
        run: go tool -modfile=tools.go.mod golangci-lint run --config=tools/lint/golangci.toml

  dprint:
    runs-on: ubuntu-24.04
    name: Format (dprint)
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run dprint check
        uses: dprint/check@371a959e3c77f34a76a03d2c50df2e3f2302d016 # v2.6

  govulncheck:
    runs-on: ubuntu-24.04
    name: Vulnerability Check
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools.go.sum

      # Pinned in tools.go.mod. Exits non-zero only for vulnerabilities whose
      # vulnerable symbols are actually called.
      - name: Run govulncheck
        run: go tool -modfile=tools.go.mod govulncheck ./...

  actions-lint:
    runs-on: ubuntu-24.04
    name: Lint (Actions)
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools.go.sum

      # actionlint runs the runner's preinstalled shellcheck on run: scripts.
      - name: Run actionlint
        run: go tool -modfile=tools.go.mod actionlint

      - name: Run ghalint
        run: go tool -modfile=tools.go.mod ghalint run -c tools/lint/ghalint.yaml
