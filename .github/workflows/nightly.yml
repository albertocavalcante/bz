name: Nightly

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force build even if no changes"
        required: false
        type: boolean
        default: false

# A cancelled run could leave the nightly release deleted but not recreated.
concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  check-changes:
    runs-on: ubuntu-24.04
    name: Check for Changes
    timeout-minutes: 5
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      short_sha: ${{ steps.check.outputs.short_sha }}
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for changes
        id: check
        env:
          FORCE: ${{ inputs.force }}
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"

          if [ "$FORCE" == "true" ]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "Force build requested"
            exit 0
          fi

          # The nightly release tag points at the commit that was built.
          if NIGHTLY_SHA=$(git rev-parse --verify --quiet "refs/tags/nightly^{commit}"); then
            HEAD_SHA=$(git rev-parse HEAD)
            if [ "$NIGHTLY_SHA" == "$HEAD_SHA" ]; then
              echo "should_build=false" >> "$GITHUB_OUTPUT"
              echo "No changes since last nightly"
            else
              echo "should_build=true" >> "$GITHUB_OUTPUT"
              echo "Changes detected"
            fi
          else
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "No previous nightly"
          fi

  test:
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    name: Test
    timeout-minutes: 15
    permissions:
      contents: read
      checks: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            tools.go.sum

      - name: Test
        run: go tool -modfile=tools.go.mod gotestsum --format pkgname-and-test-fails --junitfile test-results.xml -- -race ./...

      - name: Test report
        if: always()
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a # v3.2.0
        with:
          name: Test Results
          path: test-results.xml
          reporter: java-junit
          fail-on-error: false

  build:
    needs: check-changes
    if: needs.check-changes.outputs.should_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            goos: linux
            goarch: amd64
            name: linux-amd64
          - os: ubuntu-24.04
            goos: linux
            goarch: arm64
            name: linux-arm64
          - os: macos-15
            goos: darwin
            goarch: arm64
            name: darwin-arm64
          - os: macos-15
            goos: darwin
            goarch: amd64
            name: darwin-amd64
          - os: windows-2022
            goos: windows
            goarch: amd64
            name: windows-amd64

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.name }})
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Get version
        id: version
        shell: bash
        run: |
          SHORT_SHA="${{ needs.check-changes.outputs.short_sha }}"
          DATE=$(date +%Y%m%d)
          echo "version=nightly.${DATE}.${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build (Unix)
        if: runner.os != 'Windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          COMMIT="${GITHUB_SHA::7}"
          DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          LDFLAGS="-s -w \
            -X github.com/albertocavalcante/bz/cmd.version=${{ steps.version.outputs.version }} \
            -X github.com/albertocavalcante/bz/cmd.commit=${COMMIT} \
            -X github.com/albertocavalcante/bz/cmd.date=${DATE}"
          go build -ldflags "$LDFLAGS" -o bz .
          mkdir -p dist
          tar -czvf dist/bz-${{ matrix.name }}.tar.gz bz
          cd dist
          shasum -a 256 bz-${{ matrix.name }}.tar.gz > bz-${{ matrix.name }}.tar.gz.sha256

      - name: Build (Windows)
        if: runner.os == 'Windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        shell: pwsh
        run: |
          $commit = "${{ github.sha }}".Substring(0, 7)
          $date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $ldflags = "-s -w -X github.com/albertocavalcante/bz/cmd.version=${{ steps.version.outputs.version }} -X github.com/albertocavalcante/bz/cmd.commit=$commit -X github.com/albertocavalcante/bz/cmd.date=$date"
          go build -ldflags "$ldflags" -o bz.exe .
          New-Item -ItemType Directory -Force -Path dist
          Compress-Archive -Path bz.exe -DestinationPath dist/bz-${{ matrix.name }}.zip
          $hash = (Get-FileHash -Algorithm SHA256 dist/bz-${{ matrix.name }}.zip).Hash.ToLower()
          "$hash  bz-${{ matrix.name }}.zip" | Out-File -Encoding ASCII dist/bz-${{ matrix.name }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2

        with:
          name: binary-${{ matrix.name }}
          path: dist/bz-${{ matrix.name }}.*
          if-no-files-found: error
          retention-days: 3

  release:
    # test is required so a failing suite never replaces the nightly release;
    # a skipped needs (no changes) also skips this job.
    needs: [check-changes, test, build]
    if: needs.check-changes.outputs.should_build == 'true'
    runs-on: ubuntu-24.04
    name: Create Release
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Flatten
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" \) -exec cp {} release/ \;
          ls -la release/

      - name: Generate notes
        run: |
          DATE="$(date +%Y-%m-%d)"
          cat > notes.md << 'EOF'
          ## Nightly Build

          **Commit:** `${{ needs.check-changes.outputs.short_sha }}`
          **Date:** __BUILD_DATE__

          Automated nightly build from `main`. May be unstable.

          ### Installation

          ```bash
          # macOS (Apple Silicon)
          curl -fsSL https://github.com/albertocavalcante/bz/releases/download/nightly/bz-darwin-arm64.tar.gz | tar xz
          sudo mv bz /usr/local/bin/

          # macOS (Intel)
          curl -fsSL https://github.com/albertocavalcante/bz/releases/download/nightly/bz-darwin-amd64.tar.gz | tar xz
          sudo mv bz /usr/local/bin/

          # Linux (x64)
          curl -fsSL https://github.com/albertocavalcante/bz/releases/download/nightly/bz-linux-amd64.tar.gz | tar xz
          sudo mv bz /usr/local/bin/

          # Linux (arm64)
          curl -fsSL https://github.com/albertocavalcante/bz/releases/download/nightly/bz-linux-arm64.tar.gz | tar xz
          sudo mv bz /usr/local/bin/

          # Windows (PowerShell)
          Invoke-WebRequest -Uri https://github.com/albertocavalcante/bz/releases/download/nightly/bz-windows-amd64.zip -OutFile bz.zip
          Expand-Archive bz.zip -DestinationPath .
          ```

          ### Checksums
          ```
          EOF
          sed -i "s/__BUILD_DATE__/${DATE}/" notes.md
          cat release/*.sha256 >> notes.md
          echo '```' >> notes.md

      # Remove the previous release and its tag so the new tag is created at
      # the built commit (see target_commitish below). "Not found" is the only
      # tolerated outcome; any other failure fails the job.
      - name: Delete old release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if out=$(gh release view nightly 2>&1); then
            gh release delete nightly --yes --cleanup-tag
          elif grep -qi "release not found" <<<"$out"; then
            echo "No previous nightly release"
          else
            echo "$out" >&2
            exit 1
          fi

          # A tag can outlive its release (e.g. a manually deleted release).
          if out=$(gh api "repos/${GH_REPO}/git/ref/tags/nightly" 2>&1); then
            gh api -X DELETE "repos/${GH_REPO}/git/refs/tags/nightly"
            echo "Deleted leftover nightly tag"
          elif grep -q '"status":"404"' <<<"$out"; then
            echo "No leftover nightly tag"
          else
            echo "$out" >&2
            exit 1
          fi

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: nightly
          target_commitish: ${{ github.sha }}
          name: Nightly Build
          draft: false
          prerelease: true
          body_path: notes.md
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
