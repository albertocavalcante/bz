version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    cooldown:
      default-days: 14
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    cooldown:
      default-days: 14
      semver-major-days: 30
    groups:
      go-modules:
        patterns:
          - "*"

  # The bun ecosystem keeps docs/bun.lock in sync with docs/package.json.
  - package-ecosystem: "bun"
    directory: "/docs"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(docs)"
    cooldown:
      default-days: 14
      semver-major-days: 30
    groups:
      docs-npm:
        patterns:
          - "*"
